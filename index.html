<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D4 Build Planner</title>
<meta name="description" content="A Diablo IV build planner for every class, built on the game's own data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1795503186">
</head>
<body>
<div class="app" id="app" data-site="planner">
  <nav class="rail" aria-label="Site" id="rail"></nav>

  <main class="stage">
    <header class="topbar">
      <div class="title-block">
        <input id="buildName" class="build-name" value="Untitled build" aria-label="Build name" spellcheck="false">
        <p class="class-line" id="classLine"></p>
      </div>
      <button class="btn ghost m-menu" id="mMenu" type="button" aria-expanded="false" aria-controls="topActions">Build menu</button>
      <div class="top-actions" id="topActions">
        <div class="season-toggle" role="group" aria-label="Game version">
          <button data-ver="live" class="on">Season 15</button>
          <button data-ver="ptr">Season 16 PTR</button>
        </div>
        <button class="btn ghost" id="shareBtn">Copy share link</button>
        <button class="btn ghost" id="cardBtn">Build card</button>
        <button class="btn ghost" id="exportBtn">Export</button>
        <button class="btn ghost" id="importBtn">Load build</button>
        <button class="btn ghost" id="resetBtn">New build</button>
      </div>
    </header>

    <div class="class-strip" id="classStrip" role="group" aria-label="Class"></div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="sheet" aria-selected="true">Character</button>
      <button role="tab" data-tab="gear">Gear</button>
      <button role="tab" data-tab="tree">Skill tree</button>
      <button role="tab" data-tab="shards" hidden>Class mechanic</button>
      <button role="tab" data-tab="paragon">Paragon</button>
      <button role="tab" data-tab="charms">Charms</button>
      <button role="tab" data-tab="mercs">Mercenaries</button>
      <button role="tab" data-tab="warplans">War Plans</button>
      <button role="tab" data-tab="notes">Notes</button>
      <button role="tab" data-tab="calc">Calculators</button>
      <button role="tab" data-tab="codex">Codex</button>
    </div>

    <section class="panel" id="panel-tree" hidden>
      <div class="tree-wrap">
        <svg id="tree" class="tree" role="img" aria-label="Skill tree"></svg>
        <div class="tree-frame" aria-hidden="true"><i class="thorn tl"></i><i class="thorn tr"></i></div>
        <div class="tree-hud">
          <span id="pointsSpent">0 points</span>
          <button class="btn tiny" id="fitTree">Fit</button>
          <button class="btn tiny" id="clearTree">Clear tree</button>
        </div>
        <div class="tree-legend" id="treeLegend" aria-label="Skill schools"></div>
        <div class="hotbar" id="hotbar" aria-label="Skill bar"></div>
        <p class="tree-hint">Click a node to add a point. Right-click to remove one. Drag to pan, scroll to zoom.</p>
      </div>
      <aside class="inspector" id="inspector" aria-live="polite"></aside>
    </section>

    <section class="panel" id="panel-paragon" hidden>
      <div class="tree-wrap">
        <svg id="pboard" class="tree pgrid" role="img" aria-label="Paragon boards"></svg>
        <div class="tree-hud">
          <span id="pPoints">0 points</span>
          <button class="btn tiny" id="pFit">Fit</button>
          <button class="btn tiny" id="pClear">Clear points</button>
          <button class="btn tiny" id="pReset">Reset boards</button>
        </div>
        <p class="tree-hint">Click to take a node, right-click to give it back. Click + beside a gate to attach a board. Drag to pan, scroll to zoom.</p>
      </div>
      <aside class="inspector" id="pInspector" aria-live="polite"></aside>
    </section>
    <section class="panel" id="panel-gear" hidden></section>
    <section class="panel" id="panel-charms" hidden></section>
    <section class="panel" id="panel-sheet"></section>
    <section class="panel" id="panel-theory" hidden></section>
    <section class="panel" id="panel-defense" hidden></section>
    <section class="panel" id="panel-mercs" hidden></section>
    <section class="panel" id="panel-warplans" hidden></section>
    <section class="panel" id="panel-shards" hidden></section>
    <section class="panel" id="panel-notes" hidden></section>
    <section class="panel" id="panel-library" hidden></section>
    <section class="panel" id="sitePage" hidden></section>
    <section class="panel" id="panel-calc" hidden></section>
    <section class="panel" id="panel-codex" hidden></section>
  </main>

  <aside class="ledger" id="ledger" aria-label="Build Planner summary"></aside>
</div>

<div class="picker" id="picker" hidden>
  <div class="picker-box" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
    <div class="picker-head">
      <h2 id="pickerTitle">Choose</h2>
      <input id="pickerSearch" type="search" placeholder="Search by name or effect" aria-label="Search">
      <button class="btn ghost" id="pickerClose">Close</button>
    </div>
    <div class="picker-filters" id="pickerFilters"></div>
    <div class="picker-list" id="pickerList"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="imp-wrap" id="importBox" hidden></div>
<div class="ttip" id="ttip" role="tooltip" hidden></div>

<script src="data/core-live.js?v=1795503186"></script>
<script src="data/items-live.js?v=1795503186"></script>
<script src="data/unique-guaranteed.js?v=1795503186"></script>
<script src="data/core-ptr.js?v=1795503186" onerror="void 0"></script>
<script src="data/items-ptr.js?v=1795503186" onerror="void 0"></script>
<script src="data/paragon-live.js?v=1795503186"></script>
<script src="data/paragon-ptr.js?v=1795503186" onerror="void 0"></script>
<script src="data/gear-live.js?v=1795503186"></script>
<script src="data/cube-live.js?v=1795503186"></script>
<script src="data/cube-ptr.js?v=1795503186"></script>
<script src="data/gear-ptr.js?v=1795503186" onerror="void 0"></script>
<script src="data/monsters.js?v=1795503186"></script>
<script src="data/library.js?v=1795503186"></script>
<script src="data/library-lab.js?v=1795503186"></script>
<script src="data/library-search.js?v=1795503186"></script>
<script src="data/library-scores.js?v=1795503186" onerror="void 0"></script>
<script src="data/pages.js?v=1795503186"></script>
<script src="data/sno-live.js?v=1795503186"></script>
<script src="data/sno-ptr.js?v=1795503186" onerror="void 0"></script>
<script src="js/formula.js?v=1795503186"></script>
<script src="js/text.js?v=1795503186"></script>
<script src="js/skillicons.js?v=1795503186"></script>
<script src="js/art.js?v=1795503186"></script>
<script src="js/paragon-ui.js?v=1795503186"></script>
<script src="js/itemscan.js?v=1795503186"></script>
<script src="js/app.js?v=1795503186"></script>
</body>
</html>
